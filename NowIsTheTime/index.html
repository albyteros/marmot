  // The canvas gets a full-resolution backing store and is scaled back down to CSS
  // pixels, so every hairline and numeral renders sharp on a Retina display.
  let dpr = 0;
  function resize() {
    dpr = window.devicePixelRatio || 1;
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);   // sizing the canvas clears this, so set it last
    cx = w / 2;
    cy = h / 2;
    radius = Math.min(w, h) * 0.28;
  }
  window.addEventListener('resize', resize);
  resize();

  /* ── Sunrise / sunset (NOAA sunrise equation, computed offline) ── */
  const RAD = Math.PI / 180;
  const sunCache = new Map();

  function fromJulian(j) { return new Date((j - 2440587.5) * 86400000); }

  function sunTimes(date) {
    const key = date.toDateString() + LAT + LON;
    const hit = sunCache.get(key);
    if (hit) return hit;
    if (sunCache.size > 8) sunCache.clear();
    const sun = { rise: null, set: null, polar: null };
    sunCache.set(key, sun);

    const lw = -LON;
    const jNow = date.valueOf() / 86400000 + 2440587.5;
    const n = Math.round(jNow - 2451545.0 + 0.0009 - lw / 360);
    const jNoon = 2451545.0 + 0.0009 + lw / 360 + n;

    const M = (357.5291 + 0.98560028 * (jNoon - 2451545.0)) % 360;
    const C = 1.9148 * Math.sin(M * RAD) + 0.0200 * Math.sin(2 * M * RAD) + 0.0003 * Math.sin(3 * M * RAD);
    const lambda = (M + C + 180 + 102.9372) % 360;
    const jTransit = jNoon + 0.0053 * Math.sin(M * RAD) - 0.0069 * Math.sin(2 * lambda * RAD);
    const delta = Math.asin(Math.sin(lambda * RAD) * Math.sin(23.4397 * RAD));
    const cosW = (Math.sin(-0.833 * RAD) - Math.sin(LAT * RAD) * Math.sin(delta)) /
                 (Math.cos(LAT * RAD) * Math.cos(delta));

    if (cosW < -1 || cosW > 1) {          // sun never sets, or never rises
      sun.rise = sun.set = null;
      sun.polar = cosW < -1 ? "MIDNIGHT SUN" : "POLAR NIGHT";
      return sun;
    }
    const omega = Math.acos(cosW) / RAD;
    sun.polar = null;
    sun.rise = fromJulian(jTransit - omega / 360);
    sun.set  = fromJulian(jTransit + omega / 360);
    return sun;
  }

  // where on the 12-hour dial a given time sits
  function dialAngle(d) {
    const hr = (d.getHours() % 12) + d.getMinutes() / 60 + d.getSeconds() / 3600;
    return (hr / 12) * Math.PI * 2 - Math.PI / 2;
  }

  function drawSunIcon(x, y, s, setting, alpha) {
    const r = s * 0.40;
    const horizonY = y + s * 0.48;
    const sunY = setting ? horizonY : horizonY - r * 1.25;   // rising sun clears the line, setting sun sinks into it

    ctx.save();
    ctx.strokeStyle = `rgba(230,230,230,${alpha})`;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    ctx.lineWidth = Math.max(1, s * 0.09);
    const first = setting ? 1 : 0, last = setting ? 5 : 6;
    for (let i = first; i <= last; i++) {
      const a = Math.PI + (i / 6) * Math.PI;                 // upper half only
      const ca = Math.cos(a), sa = Math.sin(a);
      ctx.beginPath();
      ctx.moveTo(x + ca * r * 1.45, sunY + sa * r * 1.45);
      ctx.lineTo(x + ca * r * 2.05, sunY + sa * r * 2.05);
      ctx.stroke();
    }

    ctx.lineWidth = Math.max(1, s * 0.10);
    ctx.beginPath();
    if (setting) ctx.arc(x, sunY, r, Math.PI, Math.PI * 2);
    else ctx.arc(x, sunY, r, 0, Math.PI * 2);
    ctx.stroke();

    ctx.lineWidth = Math.max(1, s * 0.09);
    ctx.beginPath();
    ctx.moveTo(x - s * 0.95, horizonY);
    ctx.lineTo(x + s * 0.95, horizonY);
    ctx.stroke();

    const vy = horizonY + s * 0.44, vw = s * 0.28, vh = s * 0.22;
    ctx.beginPath();
    if (setting) {
      ctx.moveTo(x - vw, vy - vh / 2); ctx.lineTo(x, vy + vh / 2); ctx.lineTo(x + vw, vy - vh / 2);
    } else {
      ctx.moveTo(x - vw, vy + vh / 2); ctx.lineTo(x, vy - vh / 2); ctx.lineTo(x + vw, vy + vh / 2);
    }
    ctx.stroke();
    ctx.restore();
  }

  // only the next event is shown: sunrise until it happens, then sunset,
  // then tomorrow's sunrise once the sun is down.
  function nextSunEvent(now) {
    const s = sunTimes(now);
    if (!s.rise || !s.set) return null;
    if (now < s.rise) return { at: s.rise, setting: false };
    if (now < s.set)  return { at: s.set,  setting: true  };
    const t = sunTimes(new Date(now.getTime() + 86400000));
    return t.rise ? { at: t.rise, setting: false } : null;
  }

  function drawSunMarkers(now) {
    const next = nextSunEvent(now);
    if (!next) return;

    const size = Math.max(9, radius * 0.07);
    const ring = radius * 1.14;
    const a = dialAngle(next.at);
    drawSunIcon(cx + Math.cos(a) * ring, cy + Math.sin(a) * ring, size, next.setting, 0.75);
  }

  function drawClockFace() {
    ctx.strokeStyle = "rgba(220,220,220,0.55)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = "rgba(220,220,220,0.65)";
    for (let i = 0; i < 60; i++) {
      const angle = (i / 60) * Math.PI * 2;
      const isHour = i % 5 === 0;
      const rOuter = radius;
      const rInner = radius - (isHour ? 14 : 7);
      ctx.lineWidth = isHour ? 2.2 : 1.2;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(angle) * rOuter, cy + Math.sin(angle) * rOuter);
      ctx.lineTo(cx + Math.cos(angle) * rInner, cy + Math.sin(angle) * rInner);
      ctx.stroke();
    }

    drawNumerals();
  }

  const ROMAN = ["XII","I","II","III","IV","V","VI","VII","VIII","IX","X","XI"];

  function drawNumerals() {
    ctx.font = `${Math.max(12, radius * 0.105)}px 'New Heterodox Mono', monospace`;
    ctx.fillStyle = "rgba(225,225,225,0.85)";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const numeralRadius = radius - radius * 0.17;

    for (let i = 0; i < 12; i++) {
      const angle = (i / 12) * Math.PI * 2 - Math.PI / 2;
      const x = cx + Math.cos(angle) * numeralRadius;
      const y = cy + Math.sin(angle) * numeralRadius;
      ctx.fillText(ROMAN[i], x, y);
    }
  }

  function drawHand(angle, length, width, alpha) {
    ctx.strokeStyle = `rgba(230,230,230,${alpha})`;
    ctx.lineWidth = width;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(angle) * length, cy + Math.sin(angle) * length);
    ctx.stroke();
  }

  function drawReadout(now) {
    const pad = n => n.toString().padStart(2, "0");
    const h24 = now.getHours();
    const h12 = h24 % 12 || 12;                       // 0 -> 12, 13 -> 1
    const meridiem = h24 < 12 ? "AM" : "PM";
    const timeStr = `${pad(h12)}:${pad(now.getMinutes())}:${pad(now.getSeconds())} ${meridiem}`;
    const dateStr = now.toLocaleDateString(undefined, { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
    const baseY = cy + radius * 1.18 + 48;

    ctx.textBaseline = "alphabetic";
    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(230,230,230,0.85)";
    ctx.font = "20px 'New Heterodox Mono', monospace";
    ctx.fillText(timeStr, cx, baseY);
    ctx.font = "13px 'New Heterodox Mono', monospace";
    ctx.fillStyle = "rgba(180,180,180,0.6)";
    ctx.fillText(dateStr.toUpperCase(), cx, baseY + 22);

    // uptime + credit readout, bottom left
    ctx.textAlign = "left";
    ctx.font = "13px 'New Heterodox Mono', monospace";
    ctx.fillStyle = "rgba(255,255,255,0.3)";
    ctx.fillText(`UPTIME  ${Math.floor(performance.now()/1000)}S`, 24, h - 42);
    ctx.fillText('"NOW IS THE TIME" BY ALBYTEROS', 24, h - 24);
  }

  function draw() {
    const now = new Date();
    if ((window.devicePixelRatio || 1) !== dpr) resize();   // moved to a display of a different density

    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, w, h);
    drawClockFace();
    drawSunMarkers(now);

    const sec = now.getSeconds() + now.getMilliseconds() / 1000;
    const min = now.getMinutes() + sec / 60;
    const hr = (now.getHours() % 12) + min / 60;

    drawHand((hr / 12) * Math.PI * 2 - Math.PI / 2, radius * 0.5, 4.5, 0.9);
    drawHand((min / 60) * Math.PI * 2 - Math.PI / 2, radius * 0.75, 3, 0.75);
    drawHand((sec / 60) * Math.PI * 2 - Math.PI / 2, radius * 0.85, 1.5, 0.5);

    ctx.fillStyle = "rgba(230,230,230,0.9)";
    ctx.beginPath();
    ctx.arc(cx, cy, 3, 0, Math.PI * 2);
    ctx.fill();

    drawReadout(now);
    requestAnimationFrame(draw);
  }
  document.fonts.ready.then(() => draw());
</script>
</body>
</html>
