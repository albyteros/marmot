<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
	<title>Playing Gates</title>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			border: 0;
			height: 100%;
			background: #000;
		}
		body {
			display: flex;
			align-items: center;
			justify-content: center;
			overflow: hidden;
			touch-action: none;
		}
		/* The game renders at a fixed 1152x648 (Godot's default viewport, stretch
		   mode "disabled"), so pin the canvas to that resolution and letterbox it
		   into the middle of the window instead of letting the engine blow the
		   canvas up to full-window size. */
		#canvas {
			display: block;
			margin: 0;
			padding: 0;
			border: 0;
			background: #000;
			aspect-ratio: 1152 / 648;
			width: min(100vw, 100vh * 1152 / 648);
			height: auto;
		}
		@supports (height: 100dvh) {
			#canvas { width: min(100vw, 100dvh * 1152 / 648); }
		}
		#canvas:focus {
			outline: none;
		}
	</style>
</head>
<body>
	<canvas id="canvas" width="1152" height="648"></canvas>
	<script src="PlayingGates.js"></script>
	<script>
		const engine = new Engine({"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"PlayingGates","experimentalVK":false,"fileSizes":{"PlayingGates.pck":2702500,"PlayingGates.wasm":38034280},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
		engine.startGame();
	</script>
</body>
</html>
